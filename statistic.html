<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Report</title>
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
</head>
<body>
    
    <nav class="navbar topbar px-4">
        <span class="navbar-brand text-white fw-bold">
            E-Report <span class="brand-light">Santri</span>
        </span>
        <div class="admin-profile">
            <div>
                 <span>Admin</span>
                 <small>Pengelola Sistem</small>
            </div>
            <div class="admin-avatar">AD</div>
        </div>
    </nav>

    <div class="row">
        <aside class="sidebar col-lg-2 p-4">
            <h5 class="menu-label">Menu</h5>
            <a href="index.html" class="menu-link"> <i class="bi bi-bar-chart-line-fill"></i> Dahsboard</a>
            <a href="" class="menu-link active"> <i class="bi bi-bookmark-check-fill"></i> Data Laporan</a>
            <a href="" class="menu-link"> <i class="bi bi-gear-fill"></i> Pengaturan</a>
        </aside>
        <main class="col-lg-10 p-4">
            <h2>Statistik Data Laporan</h2>

            <canvas id="canvas-chart"></canvas>
            
        </main>
    </div>

    <script src="assets/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        const ctx = document.getElementById('canvas-chart');
      
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Red', 'Blue', 'Yellow', 'Green', 'Purple', 'Orange'],
            datasets: [{
              label: '# of Votes',
              data: [12, 19, 3, 5, 2, 3],
              borderWidth: 1
            }]
          },
          options: {
            scales: {
              y: {
                beginAtZero: true
              }
            }
          }
        });
      </script>
</body>
</html>
